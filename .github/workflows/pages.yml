# 手動モックアップ（mockup/）と AI 対戦の試遊版（app/）をビルドして GitHub Pages に公開する
#   /       … 手動モックアップ
#   /play/  … AI 対戦の試遊版
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mockup/**'
      - 'app/**'
      - 'engine/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 手動モックアップ
        working-directory: mockup
        run: |
          npm ci
          npm test
          npm run build
      - name: ルールエンジンのテスト
        working-directory: engine
        run: |
          npm ci
          npm test
        env:
          SIM_GAMES: 100
      - name: AI 対戦の試遊版
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: まとめる
        run: |
          mkdir -p site
          cp -r mockup/dist/. site/
          mkdir -p site/play
          cp -r app/dist/. site/play/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
